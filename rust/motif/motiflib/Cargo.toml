[package]
name = "motiflib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.8.5"
hex = "0.4.3"
num = "0.4.1"
num-traits = "0.2.16"
serde = { version = "1.0", features = ["derive"] }
num-derive = "0.4.0"
derivative = "2.2.0"
log = "0.4.20"
# Disable timestamps on logs for now.
simple_logger = { version = "4.3.3", default-features = false, features = ["colors"] }
# remora = { path = "../../remora" }
remora.workspace = true
code-gen = { path = "../code-gen/" }
rmp-serde.workspace = true
serde_json = "1.0.120"
rmpv = "1.3.0"
prost = "0.13.1"
prost-types = "0.13.1"

[build-dependencies]
prost-build = "0.13.1"

[features]
msgpack = []
