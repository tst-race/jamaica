[package]
name = "client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
motiflib = { path = "../motiflib" }
log.workspace = true
simple_logger.workspace = true
code-gen = { path = "../code-gen/" }
# remora = { path = "../../remora" }
clap.workspace = true
remora.workspace = true
simplelog = "0.12.2"
paste = "1.0.15"
# rmp-serde = "1.3.0"
rmp-serde.workspace = true
csv = "1.3.0"
const_format.workspace = true

[[bin]]
name = "client"
path = "src/main.rs"

[lib]
name = "clientlib"
path = "src/lib.rs"
