# Copyright 2024 Two Six Technologies.

[package]
name = "remora"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.1", features = ["derive"] }
dialoguer = "0.11.0"
hex = "0.4.3"
log = "0.4.21"
regex = "1.10.3"
rtshark = { git = "https://github.com/gregpaton08/rtshark.git", branch = "all-the-changes" }
# rtshark = "2.7.1"
# rtshark = { path = "../rtshark/" }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
simple-logging = "2.0.2"
simple_logger = { version = "4.3.3", default-features = false, features = ["colors"] }
simplelog = "0.12.2"

# [patch.crates-io]

[[bin]]
name = "remora"
path = "src/main.rs"

[lib]
name = "remora_lib"
path = "src/lib.rs"
